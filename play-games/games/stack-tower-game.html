<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Stack · Tower Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0a0a12; --ink-2:#12121f;
    --neon:#e8772e; --neon-bright:#ff8a3d; --gold:#f4b740;
    --good:#37e0a0; --fg:#f5f3ef; --muted:#a8a39b;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--ink);color:var(--fg);font-family:'Source Sans 3',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;}
  body{display:grid;place-items:center;}

  .stage{
    position:relative;
    width:min(100vw,520px);
    height:min(100dvh,880px);
    overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.6);
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer;}

  /* ---- HUD ---- */
  .hud{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;padding:24px;pointer-events:none;z-index:5;}
  .score{font-family:'Bebas Neue';font-size:clamp(4rem,16vw,6.5rem);line-height:.85;letter-spacing:.02em;text-shadow:0 0 30px rgba(0,0,0,.5);}
  .score.bump{animation:bump .25s ease;}
  @keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.22);}100%{transform:scale(1);}}
  .best{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px;}

  .combo{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    font-family:'Bebas Neue';font-size:2.4rem;letter-spacing:.05em;color:var(--gold);
    opacity:0;pointer-events:none;z-index:6;white-space:nowrap;text-shadow:0 0 22px rgba(244,183,64,.7);
  }
  .combo.show{animation:comboPop .8s cubic-bezier(.22,.61,.36,1);}
  @keyframes comboPop{
    0%{opacity:0;transform:translate(-50%,-40%) scale(.5);}
    25%{opacity:1;transform:translate(-50%,-50%) scale(1.2);}
    70%{opacity:1;transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-70%) scale(1);}
  }

  .hint{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);font-size:.82rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);z-index:5;pointer-events:none;text-align:center;width:90%;transition:opacity .4s;}
  .hint.hide{opacity:0;}
  .hint .tap{display:inline-block;animation:tapPulse 1.1s ease-in-out infinite;}
  @keyframes tapPulse{50%{opacity:.35;transform:scale(.9);}}

  /* ---- Overlay ---- */
  .overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;background:rgba(8,8,16,.82);backdrop-filter:blur(8px);transition:opacity .45s;gap:4px;}
  .overlay.hidden{opacity:0;pointer-events:none;}
  .overlay .kick{font-size:.72rem;letter-spacing:.4em;text-transform:uppercase;color:var(--neon-bright);font-weight:700;margin-bottom:10px;}
  .overlay h1{font-family:'Bebas Neue';font-weight:400;font-size:clamp(3.4rem,16vw,5.5rem);line-height:.9;text-transform:uppercase;}
  .overlay h1 .glow{color:var(--neon-bright);text-shadow:0 0 30px rgba(255,138,61,.5);}
  .overlay p{color:var(--muted);font-weight:300;max-width:32ch;margin:14px 0 6px;line-height:1.6;}
  .overlay .final{font-family:'Bebas Neue';font-size:5rem;color:var(--gold);line-height:1;margin:6px 0;text-shadow:0 0 26px rgba(244,183,64,.4);}
  .overlay .best2{color:var(--muted);letter-spacing:.1em;font-size:.9rem;text-transform:uppercase;margin-bottom:8px;}
  .btn{margin-top:20px;font-family:'Bebas Neue';font-size:1.8rem;letter-spacing:.08em;color:var(--ink);background:linear-gradient(135deg,var(--neon-bright),var(--neon));border:none;border-radius:100px;padding:.55rem 2.6rem;cursor:pointer;box-shadow:0 12px 30px rgba(232,119,46,.4);transition:transform .15s,box-shadow .25s;}
  .btn:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(232,119,46,.55);}
  .btn:active{transform:translateY(0) scale(.97);}
  .btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}

  .perfectflash{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0;background:radial-gradient(circle at 50% 60%,rgba(55,224,160,.25),transparent 60%);}
  .perfectflash.go{animation:pf .4s ease;}
  @keyframes pf{0%{opacity:1;}100%{opacity:0;}}

  @media (prefers-reduced-motion:reduce){
    .score.bump,.combo.show,.perfectflash.go,.hint .tap{animation:none;}
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>

  <div class="hud">
    <div class="score" id="scoreVal">0</div>
    <div class="best" id="bestVal">Best 0</div>
  </div>
  <div class="combo" id="combo"></div>
  <div class="perfectflash" id="pf"></div>
  <div class="hint" id="hint"><span class="tap">Tap / Space</span> to drop the block</div>

  <div class="overlay" id="overlay">
    <div class="kick">Tap · Stack · Climb</div>
    <h1>Stack<span class="glow">.</span></h1>
    <p>A block slides back and forth. Tap to drop it on the tower. Nail it dead-center for a <strong>perfect</strong> — and the block grows back. Any overhang gets sliced off. Build as high as you can.</p>
    <button class="btn" id="startBtn">Play</button>
  </div>
</div>

<script>
(() => {
  "use strict";
  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  const stage=document.getElementById('stage');
  const $=id=>document.getElementById(id);
  const scoreVal=$('scoreVal'), bestVal=$('bestVal'), comboEl=$('combo'),
        hintEl=$('hint'), overlay=$('overlay'), startBtn=$('startBtn'), pf=$('pf');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W=0,H=0,DPR=1;
  function resize(){
    const r=stage.getBoundingClientRect();
    W=r.width; H=r.height; DPR=Math.min(window.devicePixelRatio||1,2);
    canvas.width=W*DPR; canvas.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }

  // ---- Config ----
  const BLOCK_H = 38;            // logical block height (px)
  const BASE_Y = () => H - 70;   // y of the very first block's top edge area
  const START_W = () => Math.min(260, W*0.6);
  const PERFECT_TOL = 6;         // px tolerance for a "perfect" drop

  // ---- State ----
  let state='menu';
  let stack=[];        // placed blocks: {x,w,color}
  let current=null;    // moving block {x,w,dir,speed,color}
  let chips=[];        // falling sliced pieces
  let parts=[];        // particles
  let score=0, combo=0, camY=0, targetCamY=0, shake=0;
  let best=parseInt(localStorage.getItem('stack_best')||'0',10);
  let hue=18;          // color cycle (orange-ish start)
  let lastT=0;

  bestVal.textContent='Best '+best;

  function colorFor(i){
    const h=(hue + i*9)%360;
    const s=70, l=58;
    return `hsl(${h} ${s}% ${l}%)`;
  }

  function reset(){
    state='play';
    stack=[]; chips=[]; parts=[];
    score=0; combo=0; camY=0; targetCamY=0; shake=0;
    hue=18 + Math.floor(Math.random()*40);
    // base block centered
    const w=START_W();
    stack.push({ x:(W-w)/2, w, color:colorFor(0) });
    spawnMoving();
    scoreVal.textContent='0';
    hintEl.classList.remove('hide');
    lastT=performance.now();
  }

  function topBlock(){ return stack[stack.length-1]; }

  function spawnMoving(){
    const prev=topBlock();
    const fromLeft = stack.length%2===0;     // alternate sides
    const speed = 150 + Math.min(stack.length*6, 240); // ramps up
    current={
      x: fromLeft ? -prev.w : W,
      w: prev.w,
      dir: fromLeft ? 1 : -1,
      speed,
      color: colorFor(stack.length)
    };
  }

  // y (in world space) for stack index i (top edge). index 0 = base at bottom.
  function blockY(i){ return BASE_Y() - i*BLOCK_H; }

  // ---- Drop ----
  function drop(){
    if(state==='menu'||state==='over') return;
    if(!current) return;
    hintEl.classList.add('hide');
    const prev=topBlock();
    const cur=current;
    const overlapL=Math.max(cur.x, prev.x);
    const overlapR=Math.min(cur.x+cur.w, prev.x+prev.w);
    const overlap=overlapR-overlapL;

    if(overlap<=0){
      // total miss -> the block tumbles off, game over
      chips.push({x:cur.x,w:cur.w,y:blockY(stack.length),vy:-40,vx:cur.dir*60,rot:0,vr:(Math.random()-.5)*6,color:cur.color});
      current=null;
      gameOver();
      return;
    }

    const diff = cur.x - prev.x;          // offset
    const isPerfect = Math.abs(diff) <= PERFECT_TOL;

    let placedX, placedW;
    if(isPerfect){
      // snap perfectly, and GROW back a little (signature reward)
      placedX = prev.x;
      placedW = prev.w; // keep full width; bonus: nudge back toward START_W
      // grow back up to 14px if previously shaved
      const grow=Math.min(14, START_W()-placedW);
      placedX -= grow/2; placedW += grow;
      combo++;
      score += 2 + Math.floor(combo/2);   // perfect bonus + combo
      showCombo();
      flashPerfect();
      burst(placedX+placedW/2, blockY(stack.length), '#37e0a0', 18);
    } else {
      // slice off the overhang
      placedX=overlapL; placedW=overlap;
      combo=0;
      score += 1;
      // create falling chip from the sliced part
      const chipX = diff>0 ? overlapR : cur.x;
      const chipW = cur.w-overlap;
      chips.push({x:chipX,w:chipW,y:blockY(stack.length),vy:-30,vx:(diff>0?1:-1)*80,rot:0,vr:(Math.random()-.5)*5,color:cur.color});
    }

    stack.push({x:placedX, w:placedW, color:cur.color});
    scoreVal.textContent=score;
    bumpScore();
    shake = isPerfect?0.5:0.7;

    // camera rises so the active row stays mid-screen
    targetCamY = Math.max(0, (stack.length-1)*BLOCK_H - H*0.42);

    if(placedW < 8){           // too thin to continue
      current=null;
      gameOver();
      return;
    }
    spawnMoving();
  }

  // ---- Effects ----
  function bumpScore(){ scoreVal.classList.remove('bump'); void scoreVal.offsetWidth; scoreVal.classList.add('bump'); }
  function showCombo(){
    if(combo<2) return;
    comboEl.textContent='PERFECT'+(combo>=3? '  ×'+combo : '!');
    comboEl.classList.remove('show'); void comboEl.offsetWidth; comboEl.classList.add('show');
  }
  function flashPerfect(){ if(reduce)return; pf.classList.remove('go'); void pf.offsetWidth; pf.classList.add('go'); }
  function burst(x,yWorld,color,n){
    if(reduce) return;
    const y=yWorld; // converted at draw via camY; store world y
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=60+Math.random()*240;
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-80,life:1,color,r:2+Math.random()*3,world:true});
    }
  }

  // ---- Update ----
  function update(dt){
    camY += (targetCamY-camY)*Math.min(1,dt*6);
    if(shake>0) shake=Math.max(0,shake-dt*3);

    if(current){
      current.x += current.dir*current.speed*dt;
      // bounce within generous bounds so it always crosses the tower
      const lim = W*0.5 + current.w;
      if(current.x > W){ current.x=W; current.dir=-1; }
      if(current.x < -current.w){ current.x=-current.w; current.dir=1; }
    }

    // falling chips
    for(let i=chips.length-1;i>=0;i--){
      const c=chips[i];
      c.vy += 1400*dt; c.y -= 0; c.worldY=(c.worldY??c.y);
      c.y += c.vy*dt; c.x += c.vx*dt; c.rot += c.vr*dt;
      if(c.y - camY > H+200) chips.splice(i,1);
    }
    // particles
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i]; p.vy+=900*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt*1.4;
      if(p.life<=0) parts.splice(i,1);
    }
  }

  // ---- Render ----
  function worldToScreenY(worldY){ return worldY + camY; }

  function draw(){
    // bg gradient shifts with height
    const topHue=(hue+score*2)%360;
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,`hsl(${topHue} 40% 12%)`);
    g.addColorStop(1,'#0a0a12');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    ctx.save();
    if(shake>0) ctx.translate((Math.random()-.5)*7*shake,(Math.random()-.5)*7*shake);

    // placed stack
    for(let i=0;i<stack.length;i++){
      const b=stack[i];
      const y=worldToScreenY(blockY(i));
      if(y>H+BLOCK_H || y< -BLOCK_H*2) continue;
      drawBlock(b.x,y,b.w,b.color, i===stack.length-1);
    }
    // moving block
    if(current){
      const y=worldToScreenY(blockY(stack.length));
      drawBlock(current.x,y,current.w,current.color,true,true);
    }
    // chips
    for(const c of chips){
      const y=worldToScreenY(c.y);
      ctx.save(); ctx.translate(c.x+c.w/2,y+BLOCK_H/2); ctx.rotate(c.rot);
      drawBlockRaw(-c.w/2,-BLOCK_H/2,c.w,c.color,.8);
      ctx.restore();
    }
    // particles
    for(const p of parts){
      const y=worldToScreenY(p.y);
      ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,y,p.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.restore();
  }

  function drawBlock(x,y,w,color,active,moving){
    drawBlockRaw(x,y,w,color,1, active, moving);
  }
  function drawBlockRaw(x,y,w,color,alpha,active,moving){
    ctx.save();
    ctx.globalAlpha=alpha;
    // shadow / depth: darker bottom face
    const grad=ctx.createLinearGradient(x,y,x,y+BLOCK_H);
    grad.addColorStop(0, lighten(color,12));
    grad.addColorStop(1, darken(color,10));
    ctx.fillStyle=grad;
    if(moving){ ctx.shadowColor='rgba(255,255,255,.25)'; ctx.shadowBlur=18; }
    rr(x,y,w,BLOCK_H,5); ctx.fill();
    ctx.shadowBlur=0;
    // top highlight strip
    ctx.fillStyle='rgba(255,255,255,.16)';
    rr(x+3,y+3,Math.max(0,w-6),5,3); ctx.fill();
    // side bevel
    ctx.fillStyle='rgba(0,0,0,.18)';
    ctx.fillRect(x,y+BLOCK_H-6,w,6);
    ctx.restore();
  }

  function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function lighten(hsl,amt){ return adjL(hsl,amt); }
  function darken(hsl,amt){ return adjL(hsl,-amt); }
  function adjL(hsl,amt){
    const m=hsl.match(/hsl\((\d+(?:\.\d+)?)\s+(\d+)%\s+(\d+)%\)/);
    if(!m) return hsl;
    let l=Math.max(0,Math.min(100,parseFloat(m[3])+amt));
    return `hsl(${m[1]} ${m[2]}% ${l}%)`;
  }

  // ---- Input ----
  function onTap(e){
    if(e){ e.preventDefault?.(); }
    if(state==='play') drop();
  }
  canvas.addEventListener('pointerdown', onTap);
  document.addEventListener('keydown', e=>{
    if(e.code==='Space'||e.key===' '){ e.preventDefault(); if(state==='play') drop(); }
  });

  // ---- Loop ----
  function frame(now){
    try{
      const dt=Math.min(0.033,(now-lastT)/1000)||0; lastT=now;
      if(state==='play') update(dt);
      else if(state==='menu'||state==='over') idleUpdate(dt);
      draw();
    }catch(err){ console.error(err); }
    requestAnimationFrame(frame);
  }
  // gentle idle so menu isn't dead
  function idleUpdate(dt){
    camY += (targetCamY-camY)*Math.min(1,dt*4);
    for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1.4; if(p.life<=0)parts.splice(i,1);}
    for(let i=chips.length-1;i>=0;i--){ const c=chips[i]; c.vy+=1400*dt;c.y+=c.vy*dt;c.x+=c.vx*dt;c.rot+=c.vr*dt; if(c.y-camY>H+200)chips.splice(i,1);}
  }

  function gameOver(){
    state='over';
    if(score>best){ best=score; localStorage.setItem('stack_best',best); }
    overlay.innerHTML=`
      <div class="kick">Toppled</div>
      <h1>Game <span class="glow">Over</span></h1>
      <div class="final">${score}</div>
      <div class="best2">Height ${stack.length} · Best ${best}</div>
      <p>${score>=best && score>0 ? 'New record! Steady hands. 🗼' : 'So close. One more?'}</p>
      <button class="btn" id="againBtn">Play Again</button>`;
    overlay.classList.remove('hidden');
    $('againBtn').addEventListener('click',start);
    bestVal.textContent='Best '+best;
  }

  function start(){ overlay.classList.add('hidden'); reset(); }
  startBtn.addEventListener('click',start);
  window.addEventListener('resize',resize);

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
